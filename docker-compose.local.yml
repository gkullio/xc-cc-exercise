networks:
  lab:
    driver: bridge

services:
  # --- Gateway (8081) ---
  gateway:
    build: ./gateway
    ports:
      - "8081:8081"
    restart: always
    networks:
      - lab
    depends_on:
      - catalog
      - capsule-store
      - dragon-radar-api
      - gravity-viewer

  # --- Entry Points (8080 range) ---
  capsule-info:
    build: ./capsule-info
    ports:
      - "8080:8080"
    restart: always
    networks:
      - lab
    depends_on:
      - scouter-app

  # --- App Ports (3000 range) ---
  catalog:
    build: ./catalog
    restart: always
    networks:
      - lab

  capsule-store:
    build: ./capsule-store
    ports:
      - "3000:3000"
    restart: always
    networks:
      - lab

  dragon-radar-api:
    build: ./dragon-radar-api
    ports:
      - "3001:3001"
    restart: always
    networks:
      - lab

  gravity-viewer:
    build: ./gravity-viewer
    ports:
      - "3002:3002"
    restart: always
    networks:
      - lab

  # --- Internal Services ---
  scouter-app:
    build: ./scouter-app
    restart: always
    networks:
      - lab
