networks:
  lab:
    driver: bridge

services:
  # --- Gateway (8081) ---
  gateway:
    image: ghcr.io/f5xc-salesdemos/gateway:latest
    pull_policy: always
    ports:
      - "8081:8081"
    restart: always
    networks:
      - lab
    depends_on:
      - catalog
      - capsule-store
      - dragon-radar-api
      - gravity-viewer

  # --- Entry Points (8080 range) ---
  capsule-info:
    image: ghcr.io/f5xc-salesdemos/capsule-info:latest
    pull_policy: always
    ports:
      - "8080:8080"
    restart: always
    networks:
      - lab
    depends_on:
      - scouter-app

  # --- App Ports (3000 range) ---
  catalog:
    image: ghcr.io/f5xc-salesdemos/catalog:latest
    pull_policy: always
    restart: always
    networks:
      - lab

  capsule-store:
    image: ghcr.io/f5xc-salesdemos/capsule-store:latest
    pull_policy: always
    ports:
      - "3000:3000"
    restart: always
    networks:
      - lab

  dragon-radar-api:
    image: ghcr.io/f5xc-salesdemos/dragon-radar-api:latest
    pull_policy: always
    ports:
      - "3001:3001"
    restart: always
    networks:
      - lab

  gravity-viewer:
    image: ghcr.io/f5xc-salesdemos/gravity-viewer:latest
    pull_policy: always
    ports:
      - "3002:3002"
    restart: always
    networks:
      - lab

  # --- Internal Services ---
  scouter-app:
    image: ghcr.io/f5xc-salesdemos/scouter-app:latest
    pull_policy: always
    restart: always
    networks:
      - lab
