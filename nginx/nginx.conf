upstream capsule_info {
    server capsule-info:8080;
}
upstream capsule_store {
    server capsule-store:3000;
}
upstream dragon_radar {
    server dragon-radar-api:3001;
}
upstream gravity_viewer {
    server gravity-viewer:3004;
}
upstream kasm_chrome {
    server chrome:6901;
}

# Kasmweb Chrome - port 6080
server {
    listen 6080;

    location / {
        proxy_pass https://kasm_chrome/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_ssl_verify off;
    }
}

# Portal - info.cc.local
server {
    listen 80;
    server_name info.cc.local;

    location / {
        proxy_pass http://capsule_info/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Capsule Store - store.cc.local
server {
    listen 80;
    server_name store.cc.local;

    location / {
        proxy_pass http://capsule_store/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Dragon Radar API - radar.cc.local
server {
    listen 80;
    server_name radar.cc.local;

    location / {
        proxy_pass http://dragon_radar/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Gravity Viewer - gravity.cc.local
server {
    listen 80;
    server_name gravity.cc.local;

    location / {
        proxy_pass http://gravity_viewer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# App Catalog - catalog.cc.local (static)
server {
    listen 80;
    server_name catalog.cc.local;

    location / {
        root /usr/share/nginx/catalog;
        index index.html;
    }
}

# Default - redirect to catalog
server {
    listen 80 default_server;

    location / {
        return 302 http://catalog.cc.local;
    }
}
