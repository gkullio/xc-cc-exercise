<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Radar API | Capsule Corporation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        :root {
            --color-bg-dark: #0D1B2A;
            --color-internal-banner: #f59e0b;
            --color-panel: #1B263B;
            --color-text: #e2e8f0;
            --color-text-muted: #94a3b8;
            --color-border: rgba(255,255,255,0.15);
            --color-accent: #3b82f6;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: var(--color-bg-dark);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .internal-banner {
            background: var(--color-internal-banner);
            color: #000;
            text-align: center;
            padding: 0.75rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .api-header {
            background: var(--color-panel);
            border-bottom: 1px solid var(--color-border);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .api-header h1 {
            margin: 0;
            color: var(--color-text);
            font-size: 1.5rem;
            font-weight: 600;
        }
        .api-header p {
            margin: 0.25rem 0 0 0;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }
        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--color-accent);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .download-link:hover {
            background: #2563eb;
        }
        .download-link svg {
            width: 18px;
            height: 18px;
        }

        /* Swagger UI overrides for better readability */
        .swagger-ui {
            background: var(--color-bg-dark);
            padding: 1rem;
        }
        .swagger-ui .topbar {
            display: none;
        }
        .swagger-ui .info {
            margin: 20px 0;
        }
        .swagger-ui .info .title {
            color: var(--color-text) !important;
        }
        .swagger-ui .info .description,
        .swagger-ui .info .description p {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .scheme-container {
            background: var(--color-panel) !important;
            padding: 1rem !important;
            border-radius: 8px;
        }
        .swagger-ui .schemes > label {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui select {
            background: var(--color-bg-dark) !important;
            color: var(--color-text) !important;
            border-color: var(--color-border) !important;
        }

        /* Operation blocks */
        .swagger-ui .opblock-tag {
            color: var(--color-text) !important;
            font-size: 1.2rem !important;
            border-bottom: 1px solid var(--color-border) !important;
        }
        .swagger-ui .opblock {
            background: var(--color-panel) !important;
            border: 1px solid var(--color-border) !important;
            border-radius: 8px !important;
            margin-bottom: 1rem !important;
        }
        .swagger-ui .opblock .opblock-summary {
            border-bottom: 1px solid var(--color-border);
        }
        .swagger-ui .opblock .opblock-summary-method {
            font-weight: 700 !important;
            min-width: 80px !important;
        }
        .swagger-ui .opblock .opblock-summary-path,
        .swagger-ui .opblock .opblock-summary-path span {
            color: var(--color-text) !important;
            font-weight: 500 !important;
        }
        .swagger-ui .opblock .opblock-summary-description {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .opblock .opblock-section-header {
            background: rgba(0,0,0,0.2) !important;
            border-bottom: 1px solid var(--color-border);
        }
        .swagger-ui .opblock .opblock-section-header h4 {
            color: var(--color-text) !important;
        }
        .swagger-ui .opblock-body pre {
            background: #0a1628 !important;
            color: var(--color-text) !important;
            border-radius: 6px;
        }
        .swagger-ui .opblock-description-wrapper p {
            color: var(--color-text-muted) !important;
        }

        /* Tables */
        .swagger-ui table {
            background: transparent !important;
        }
        .swagger-ui table thead tr th,
        .swagger-ui table thead tr td {
            color: var(--color-text-muted) !important;
            border-bottom: 1px solid var(--color-border) !important;
        }
        .swagger-ui table tbody tr td {
            color: var(--color-text) !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .swagger-ui .parameter__name {
            color: var(--color-text) !important;
        }
        .swagger-ui .parameter__type {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .parameter__in {
            color: var(--color-text-muted) !important;
        }

        /* Responses */
        .swagger-ui .responses-inner {
            background: transparent !important;
        }
        .swagger-ui .response-col_status {
            color: var(--color-text) !important;
        }
        .swagger-ui .response-col_description {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .response-col_links {
            color: var(--color-text-muted) !important;
        }

        /* Models/Schemas */
        .swagger-ui section.models {
            background: var(--color-panel) !important;
            border: 1px solid var(--color-border) !important;
            border-radius: 8px !important;
        }
        .swagger-ui section.models h4 {
            color: var(--color-text) !important;
            border-bottom: 1px solid var(--color-border) !important;
        }
        .swagger-ui section.models .model-container {
            background: rgba(0,0,0,0.2) !important;
            border-radius: 4px;
            margin: 0.5rem 0;
        }
        .swagger-ui .model-box {
            background: rgba(0,0,0,0.2) !important;
        }
        .swagger-ui .model {
            color: var(--color-text) !important;
        }
        .swagger-ui .model-title {
            color: var(--color-text) !important;
        }
        .swagger-ui .model span {
            color: var(--color-text) !important;
        }
        .swagger-ui .model .brace-open,
        .swagger-ui .model .brace-close {
            color: var(--color-text) !important;
        }
        .swagger-ui .model .property {
            color: #7dd3fc !important;
        }
        .swagger-ui .prop-type {
            color: var(--color-accent) !important;
        }
        .swagger-ui .prop-format {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .model .property.primitive {
            color: var(--color-text) !important;
        }
        /* Schema description text (the [...] brackets) */
        .swagger-ui .model-toggle:after,
        .swagger-ui .model-toggle {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .model .renderedMarkdown p {
            color: var(--color-text-muted) !important;
        }
        /* Inner model content */
        .swagger-ui .inner-object {
            color: var(--color-text) !important;
        }
        .swagger-ui table.model tbody tr td {
            color: var(--color-text) !important;
        }
        .swagger-ui table.model tbody tr td:first-child {
            color: #7dd3fc !important;
        }
        /* Constraint text like minimum/maximum */
        .swagger-ui .model .constraints {
            color: var(--color-text-muted) !important;
        }
        .swagger-ui .model-hint {
            color: var(--color-text-muted) !important;
        }
        /* All spans inside model that might have been missed */
        .swagger-ui section.models span,
        .swagger-ui section.models td {
            color: var(--color-text) !important;
        }
        .swagger-ui section.models .model-toggle::after {
            color: var(--color-text-muted) !important;
        }

        /* Buttons */
        .swagger-ui .btn {
            color: var(--color-text) !important;
            border-color: var(--color-border) !important;
        }
        .swagger-ui .btn:hover {
            background: rgba(255,255,255,0.1) !important;
        }
        .swagger-ui .try-out__btn {
            border-color: var(--color-accent) !important;
            color: var(--color-accent) !important;
        }
        .swagger-ui .execute {
            background: var(--color-accent) !important;
            border-color: var(--color-accent) !important;
        }

        /* JSON syntax highlighting */
        .swagger-ui .highlight-code .microlight {
            background: #0a1628 !important;
            color: var(--color-text) !important;
        }
        .swagger-ui .microlight .string {
            color: #a5d6ff !important;
        }
        .swagger-ui .microlight .number {
            color: #79c0ff !important;
        }
        .swagger-ui .microlight .boolean {
            color: #ff7b72 !important;
        }
    </style>
</head>
<body>
    <div class="internal-banner">
        &#9888; INTERNAL ACCESS ONLY
    </div>
    <div class="api-header">
        <div>
            <h1>Dragon Radar API</h1>
            <p>REST API for Dragon Ball location tracking</p>
        </div>
        <a href="/api/radar/openapi.yaml" download="dragon-radar-openapi.yaml" class="download-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download OpenAPI Spec
        </a>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = function() {
            SwaggerUIBundle({
                url: "/api/radar/openapi.yaml",
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout",
                deepLinking: true,
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1
            });
        };
    </script>
</body>
</html>
